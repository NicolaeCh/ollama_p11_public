services:
  ollama:
    image: ${OLLAMA_IMAGE:-quay.io/andre_lutz/ollama-ppc64le}
    container_name: ${CONTAINER_NAME:-ollama-ppc64le}
    ports:
      - "${OLLAMA_HOST_BIND:-0.0.0.0}:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_ORIGINS: ${OLLAMA_ORIGINS:-*}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-64}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
    volumes:
      - ${OLLAMA_MODELS_DIR:-./models}:/root/.ollama:Z
    networks:
      - ollama-net
      - n8n-backend
    restart: unless-stopped
networks:
  ollama-net:
    name: ollama-net-local
    driver: bridge

  n8n-backend:
    external: true
    name: n8n-ppc64le_n8n_net
